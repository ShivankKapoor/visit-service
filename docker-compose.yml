services:
  visit-service-go:
    build: .
    image: visit-service-go
    container_name: visit-service-go
    restart: unless-stopped
    dns:
      - 9.9.9.9
      - 1.1.1.1
    ports:
      - "8088:8088"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "10"
